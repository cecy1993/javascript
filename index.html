<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="description" content="Excursiones y turismo en Bariloche. Tarifas, contacto y más.">
   <meta name="keywords" content="Bariloche, turismo, excursiones, tarifas, contacto, empresa">
   <meta name="author" content="Alta Pinta">
   
   <!-- CSS unificado -->
   <link rel="stylesheet" href="assets/css/base.css">
   
   <!-- JavaScript -->
   <script src="assets/js/nav.js" defer></script>
   
   <title>Alta Pinta - Inicio</title>
</head>
<body>
   <!-- Header común -->
   <div id="header-placeholder"></div>
    <!-- Contenido principal -->
    <main id="main-content" class="main-content">
        <!-- Hero Section -->
        <section class="hero">
            <div class="hero__overlay"></div>
            <div class="hero__content">
                <h1>Descubrí Bariloche</h1>
                <p>El verano en Bariloche es una experiencia única. Si buscás aventura, naturaleza y momentos inolvidables, nuestras excursiones lacustres son la opción perfecta para vos.</p>
            </div>
        </section>
        
        <!-- Galería de paisajes -->
        <section class="gallery">
            <div class="container">
                <h2 class="section-title">Paisajes de Bariloche</h2>
                <div class="gallery__grid">
                    <img src="assets/img/paisaje1.jpg" alt="Paisaje de Bariloche 1" class="gallery__item" />
                    <img src="assets/img/paisaje2.jpg" alt="Paisaje de Bariloche 2" class="gallery__item" />
                    <img src="assets/img/Paisaje3.jpg" alt="Paisaje de Bariloche 3" class="gallery__item" />
                    <img src="assets/img/Paisaje4.jpg" alt="Paisaje de Bariloche 4" class="gallery__item" />
                    <img src="assets/img/Paisaje5.jpg" alt="Paisaje de Bariloche 5" class="gallery__item" />
                    <img src="assets/img/paisaje6.jpeg" alt="Paisaje de Bariloche 6" class="gallery__item" />
                    <img src="assets/img/paisaje7.jpg" alt="Paisaje de Bariloche 7" class="gallery__item" />
                    <img src="assets/img/paisaje8.jpg" alt="Paisaje de Bariloche 8" class="gallery__item" />
                </div>
            </div>
        </section>
    </main>
    
    <!-- Footer común -->
    <div id="footer-placeholder"></div>
    
    <script defer src="assets/js/nav.js"></script>
    <script>
        // Load header and footer partials
        async function loadPartials() {
            try {
                // Load header
                const headerResponse = await fetch('partials/header.html');
                const headerHtml = await headerResponse.text();
                document.getElementById('header-placeholder').innerHTML = headerHtml;
                
                // Load footer
                const footerResponse = await fetch('partials/footer.html');
                const footerHtml = await footerResponse.text();
                document.getElementById('footer-placeholder').innerHTML = footerHtml;
                
            } catch (error) {
                console.error('Error loading partials:', error);
            }
        }
        
        // Load partials when DOM is ready
        document.addEventListener('DOMContentLoaded', async () => {
            await loadPartials();
            // Inicializar navegación después de cargar partials
            if (window.initNavigation) {
                window.initNavigation();
            }
        });
    </script>
</body>
</html>
